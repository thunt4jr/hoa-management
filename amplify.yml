version: 1
applications:
  - appRoot: hosting
    backend:
      phases:
        build:
          commands:
            - cd "$(git rev-parse --show-toplevel)"
            - nvm use 24
            - npm ci --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
            - npx tsx scripts/attach-amplify-role.ts
    frontend:
      phases:
        build:
          commands:
            - cd "$(git rev-parse --show-toplevel)/hosting"
            - npm --prefix .. run lint
            - npm --prefix .. run typecheck
            - npm --prefix .. test
            - npm --prefix .. run build
            - npm --prefix .. run amplify:package
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - "**/*"
      cache:
        paths:
          - ../.npm/**/*
