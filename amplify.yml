version: 1
applications:
  - appRoot: hosting
    backend:
      phases:
        build:
          commands:
            - cd "$(git rev-parse --show-toplevel)"
            - nvm use 24
            - npm ci --cache .npm --prefer-offline
            - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
            - npx tsx scripts/attach-amplify-role.ts
    frontend:
      buildPath: /
      phases:
        build:
          commands:
            - npm run lint
            - npm run typecheck
            - npm test
            - npm run build
            - npm run amplify:package
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - "**/*"
      cache:
        paths:
          - .npm/**/*
