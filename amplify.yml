version: 1
backend:
  phases:
    build:
      commands:
        - nvm use 24
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch "$AWS_BRANCH" --app-id "$AWS_APP_ID"
        - npx tsx scripts/attach-amplify-role.ts
frontend:
  phases:
    build:
      commands:
        - npm run lint
        - npm run typecheck
        - npm test
        - npm run build
        - npm run amplify:package
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
