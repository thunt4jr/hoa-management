services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: hoa_owner
      POSTGRES_DB: hoa
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set a local PostgreSQL password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - local_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoa_owner -d hoa"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  local_postgres:
